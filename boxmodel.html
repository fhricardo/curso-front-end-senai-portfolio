<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background-color: rgb(209, 209, 209);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        section {
            width: 600px;
            height: 400px;
            border: 1px solid black;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            /* flex-direction: column; */
            gap: 5px;
        }

        div {
            width: 90px;
            height: 90px;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
        }

        div:nth-child(1) {
            background-color: blue;
        }

        div:nth-child(2) {
            background-color: red;
        }

        div:nth-child(3) {
            background-color: green;
        }

        div:nth-child(4) {
            background-color: gold;
        }
    </style>
</head>

<body>
    <section>
        <div>A</div>
        <div>B</div>
        <div>C</div>
        <div>D</div>
    </section>
</body>

</html>
